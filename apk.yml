name: Construir APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Copiar a app para dentro do projeto Android
        run: |
          mkdir -p android/app/src/main/assets/www
          cp index.html app.js manifest.webmanifest icon-192.png icon-512.png android/app/src/main/assets/www/

      - name: Construir
        working-directory: android
        run: gradle assembleRelease --no-daemon

      - name: Preparar ficheiro
        run: cp android/app/build/outputs/apk/release/app-release.apk o-meu-jardim.apk

      - name: Publicar para descarregar
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: O Meu Jardim ${{ github.run_number }}
          files: o-meu-jardim.apk
          make_latest: true
